# The public check: the shipped checks and the public test suite, on every push and pull request.
# A red badge is public the day it breaks — that is the point. Two jobs: stock Python 3 with nothing installed, and the same with the one optional library for real keys.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3"
      - name: Run the checks and the public suite
        run: |
          cd code
          python3 check.py
          python3 run_public_suite.py

  battery-real-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3"
      - name: Install the one optional library, for real keys
        run: python3 -m pip install pynacl
      - name: Run the checks and the public suite with the real locks installed
        run: |
          cd code
          python3 check.py
          python3 run_public_suite.py
